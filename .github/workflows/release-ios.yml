---
name: tuyulife.ios
run-name: "${{ github.workflow }} · ${{ github.run_number }}"
'on':
  workflow_dispatch: {}
concurrency:
  group: "${{ github.repository }}-ios"
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: "${{ steps.version.outputs.version }}"
      tag: "${{ steps.version.outputs.tag }}"
      source_sha: "${{ steps.version.outputs.source_sha }}"
      run_id: "${{ steps.version.outputs.run_id }}"
      run_attempt: "${{ steps.version.outputs.run_attempt }}"
      run_number: "${{ steps.version.outputs.run_number }}"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 25.2.1
    - id: version
      env:
        GH_TOKEN: "${{ github.token }}"
      run: node .github/workflows/release-ios.mjs prepare
  flow:
    name: 构建并固化途遇生活 iOS 正式资产
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: false
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      CARGO_INCREMENTAL: '0'
      GH_TOKEN: "${{ github.token }}"
      TUYU_SOURCE_SHA: "${{ github.sha }}"
      TUYU_VERSION_TAG: "${{ needs.prepare.outputs.tag }}"
      TUYU_SOFTWARE_VERSION: "${{ needs.prepare.outputs.version }}"
      SOURCE_SHA: "${{ github.sha }}"
      VERSION_TAG: "${{ needs.prepare.outputs.tag }}"
      SOFTWARE_VERSION: "${{ needs.prepare.outputs.version }}"
      RELEASE_VERSION: "${{ needs.prepare.outputs.version }}"
      RELEASE_TAG: "${{ needs.prepare.outputs.tag }}"
      PRODUCER_RUN_ID: "${{ github.run_id }}"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - id: flutter_2
      shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-ios.mjs" step 1
    - run: node .github/workflows/release-ios.mjs job
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: "${{ steps.flutter_2.outputs.version }}"
        cache: false
    - shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-ios.mjs" step 2
    - working-directory: "."
      shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-ios.mjs" step 3
    - id: complete
      name: 收集未签名候选
      run: node .github/workflows/release-ios.mjs unsigned
    - name: 交付未签名候选
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-output
        path: "${{ steps.complete.outputs.assets }}"
        if-no-files-found: error
        retention-days: 7
    needs:
    - prepare
